
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #3</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Javascript Web Output #3</h2>

    <button id="loadBtn">Load data from the API</button>
    <button id="clearBtn">Clear Table</button>

    <p>
        API:
        <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
            https://jsonplaceholder.typicode.com/todos/
        </a>
    </p>

    <p id="message"></p>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Task ID</th>
                <th>Title</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="todoTable"></tbody>
    </table>

</body>
</html>
