
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Javascript Web Output #2</h1>

    <form id="personForm">

        <div class="field">
            <label>First Name:</label>
            <input type="text" id="firstName" required>
        </div>

        <div class="field">
            <label>Middle Name:</label>
            <input type="text" id="middleName">
        </div>

        <div class="field">
            <label>Last Name:</label>
            <input type="text" id="lastName" required>
        </div>

        <div class="field">
            <label>Age:</label>
            <input type="number" id="age" min="0" max="150" required>
        </div>

        <div class="actions">
            <button type="submit" id="insertButton">Insert</button>
            <button type="button" id="clearButton">Clear</button>
        </div>

    </form>

    <fieldset>
        <legend>Records</legend>

        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Middle Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="recordsBody"></tbody>
        </table>
    </fieldset>

    <div class="bottom-controls">

        <button type="button" id="clearRecords">Clear Records</button>

        <label>Sort by:</label>

        <select id="sortBy">
            <option value="lastName">Last Name</option>
            <option value="firstName">First Name</option>
            <option value="middleName">Middle Name</option>
            <option value="age">Age</option>
        </select>

        <select id="sortOrder">
            <option value="asc">A-Z</option>
            <option value="desc">Z-A</option>
        </select>

        <button type="button" id="saveButton">
            Save to Local Storage
        </button>

    </div>

    <div id="message"></div>

    <script src="script.js"></script>

</body>
</html>
